name: Import Feeds

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC; 01:00 UTC is 03:00 in Europe/Berlin during CEST.
    - cron: "0 1 * * *"

jobs:
  import-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile import modules
        run: python3 -B -m py_compile import_jobs.py event_changes.py football_data_org.py sport_feed_importers.py sport_feed_registry.py web_app.py yourcalendar_poc.py
      - name: Run import job
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          PANDASCORE_API_KEY: ${{ secrets.PANDASCORE_API_KEY }}
        run: python3 -B import_jobs.py
      - name: Upload import artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yourcalendar-import-output
          path: |
            output/feeds/
            output/import-runs.json
            output/football-data-bl1-teams.json
            output/sport-feeds.json
            output/event-snapshots/
            output/event-changes/
          if-no-files-found: warn
          retention-days: 14
